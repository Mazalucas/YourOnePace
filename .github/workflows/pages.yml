# Requires a one-time repo setup: Settings → Pages → Build: GitHub Actions.
# Until then, this job will fail at configure-pages (expected).

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Stage static site and inject app version from package.json
        run: |
          mkdir -p _site
          cp index.html index.css app.js data.js episodeAnimeMap.js manifest.json sw.js _site/
          cp -r icons _site/
          touch _site/.nojekyll
          APP_VERSION=$(node -p "require('./package.json').version")
          sed -i "s|%APP_VERSION%|${APP_VERSION}|g" _site/index.html

      - name: Inject GA4 Measurement ID
        env:
          GA4_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
        run: |
          if [ -z "$GA4_MEASUREMENT_ID" ]; then
            echo "::error::Set repository secret GA4_MEASUREMENT_ID (Google Analytics Measurement ID G-…)"
            exit 1
          fi
          sed -i "s|%GA4_MEASUREMENT_ID%|${GA4_MEASUREMENT_ID}|g" _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deployment
